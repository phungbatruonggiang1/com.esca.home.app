name: esca_home
description: ESCA Home, the dashboard that opens every other ESCA application on the Raspberry Pi 4.
publish_to: none
version: 0.2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

# dbus is pure Dart, so it needs no native side built for the target -- the
# complication that kept this app free of packages until it had to talk to
# esca-appmanagerd.
dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: fonts/BeVietnamPro-Regular.ttf
        - asset: fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: fonts/BeVietnamPro-Bold.ttf
          weight: 700
