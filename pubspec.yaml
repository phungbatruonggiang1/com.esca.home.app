name: esca_home
description: ESCA smart-home sample UI, built to verify Flutter on a Raspberry Pi 4 running esca-image.
publish_to: none
version: 0.1.0

environment:
  # 3.6 is where Color.withValues and CardThemeData landed (Flutter 3.27).
  sdk: ">=3.6.0 <4.0.0"

# No third-party packages on purpose: a plugin would need its native side built
# and packaged for the target too, which is exactly the complication this
# sample is meant to stay clear of.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
